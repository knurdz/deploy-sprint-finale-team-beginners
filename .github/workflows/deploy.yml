name: Request Organizer Deploy

# T06: deployment runs only after the CI workflow succeeds on main (workflow_run).
# T21: production concurrency queue; minimal permissions (no repository write).
# T22: compose runtime — deployer generates remote .env and runs docker compose.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-deploy:
    name: Request deployer publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm CI gate passed
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          echo "CI workflow run ${{ github.event.workflow_run.id }} conclusion: ${{ github.event.workflow_run.conclusion }}"
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Resolve deploy request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            branch="main"
            source_run_id="$MANUAL_RUN_ID"
          else
            sha="$WORKFLOW_RUN_SHA"
            branch="$WORKFLOW_RUN_BRANCH"
            source_run_id="$WORKFLOW_RUN_ID"
          fi

          if [ "$branch" != "main" ]; then
            echo "Only main branch deploy requests are allowed. Got: $branch"
            exit 1
          fi

          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}/team-site:${sha}"

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "source_run_id=$source_run_id"
            echo "app_image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Authorize deploy with private token (server-side only)
        env:
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_DEPLOY_TOKEN:-}" ]; then
            echo "PRIVATE_DEPLOY_TOKEN is not configured."
            exit 1
          fi
          echo "Deploy authorized using masked PRIVATE_DEPLOY_TOKEN."

      - name: Build compose deploy manifest
        env:
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          APP_IMAGE: ${{ steps.request.outputs.app_image }}
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'deploy-sprint-team-01' }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME || 'deploy-sprint-team-01' }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH || '/opt/deploy-sprint/team-01/.env' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
        run: node scripts/compose-runtime-manifest.mjs

      - name: Upload compose deploy manifest
        uses: actions/upload-artifact@v4
        with:
          name: compose-deploy-request-${{ steps.request.outputs.sha }}
          path: compose-deploy-manifest.json
          if-no-files-found: error

      - name: Request compose deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          TEAM_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          APP_IMAGE: ${{ steps.request.outputs.app_image }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'deploy-sprint-team-01' }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME || 'deploy-sprint-team-01' }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH || '/opt/deploy-sprint/team-01/.env' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-beginners-main-merged",
              "client_payload": {
                  "team": "beginners",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "deploy_mode": "compose",
                  "runtime": "compose",
                  "compose_file": "compose.yml",
                  "compose_project_name": os.environ.get("COMPOSE_PROJECT_NAME", "deploy-sprint-team-01"),
                  "service_name": os.environ.get("SERVICE_NAME", "deploy-sprint-team-01"),
                  "runtime_env_path": os.environ.get("RUNTIME_ENV_PATH", "/opt/deploy-sprint/team-01/.env"),
                  "app_port": os.environ.get("APP_PORT", "8080"),
                  "image": os.environ["APP_IMAGE"],
                  "public_url": os.environ.get("PUBLIC_URL", ""),
                  "runtime_env_keys": [
                      "APP_VERSION",
                      "APP_IMAGE",
                      "APP_PORT",
                      "PUBLIC_URL",
                      "COMPOSE_PROJECT_NAME",
                      "SERVICE_NAME",
                      "RUNTIME_ENV_PATH",
                      "TEAM_NAME",
                      "TEAM_SLUG",
                      "PUBLIC_DEPLOY_LABEL",
                  ],
                  "runtime_secret_names": [
                      "PRIVATE_DEPLOY_TOKEN",
                      "WEB3FORMS_ACCESS_KEY",
                  ],
              },
          }

          print(json.dumps(payload))
          PY

          echo "T22 compose deploy: project=${COMPOSE_PROJECT_NAME} env_path=${RUNTIME_ENV_PATH} image=${APP_IMAGE}"

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer compose deployment for ${TEAM_REPO}@${TEAM_SHA}."

      - name: Post-deploy health check
        continue-on-error: true
        env:
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL || 'https://beginners.deploysprint-finals.knurdz.org' }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          echo "Waiting for ${base}/health after compose deploy request..."
          for attempt in $(seq 1 12); do
            if curl -fsS "${base}/health" | grep -qx ok; then
              echo "Health check passed on attempt ${attempt}."
              if curl -fsS "${base}/status" | grep -q '"runtime"[[:space:]]*:[[:space:]]*"compose"'; then
                echo "Status reports runtime=compose."
              fi
              if curl -fsS "${base}/status" | grep -q "${EXPECTED_SHA}"; then
                echo "Status includes expected commit ${EXPECTED_SHA}."
              fi
              exit 0
            fi
            sleep 15
          done
          echo "Health check timed out; deployer may still be running compose up."

      - name: T21 deploy concurrency summary
        run: |
          {
            echo "## T21 production concurrency"
            echo ""
            echo "- concurrency group: \`production-${{ github.ref }}\`"
            echo "- cancel-in-progress: \`false\` (overlapping deploy requests queue; VPS stays consistent)"
            echo "- permissions: \`contents: read\`, \`actions: write\` (compose manifest artifact)"
            echo ""
            echo "## T22 compose runtime"
            echo ""
            echo "- manifest artifact: \`compose-deploy-request-${{ steps.request.outputs.sha }}\`"
            echo "- remote \`.env\` path: \`${{ vars.RUNTIME_ENV_PATH || '/opt/deploy-sprint/team-01/.env' }}\` (generated at deploy, not in git)"
            echo "- image: \`${{ steps.request.outputs.app_image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
