name: Request Organizer Deploy

# T06: deployment runs only after the CI workflow succeeds on main (workflow_run).
# T21: production concurrency queue; minimal permissions (no repository write).
# T28: lock + idempotent directory replace; overlapping runs queue (cancel-in-progress: false).

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: "live = curl PUBLIC_URL after deploy request; fallback = build dist and inspect artifacts"
        required: false
        type: choice
        options:
          - live
          - fallback
        default: live

permissions:
  contents: read
  actions: read

concurrency:
  # T28: one production deploy at a time; do not cancel — queue overlapping runs.
  group: production-deploy-beginners
  cancel-in-progress: false

jobs:
  request-deploy:
    name: Request deployer publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm CI gate passed
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          echo "CI workflow run ${{ github.event.workflow_run.id }} conclusion: ${{ github.event.workflow_run.conclusion }}"
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Resolve deploy request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_RUN_ID: ${{ github.run_id }}
          DISPATCH_SMOKE_MODE: ${{ github.event.inputs.smoke_mode || 'live' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            branch="main"
            source_run_id="$MANUAL_RUN_ID"
            smoke_mode="$DISPATCH_SMOKE_MODE"
            if [ "$smoke_mode" = "fallback" ]; then
              skip_deploy="true"
            else
              skip_deploy="false"
            fi
          else
            # Starter bug used github.sha here (wrong on workflow_run). Fixed: head_sha.
            sha="$WORKFLOW_RUN_SHA"
            branch="$WORKFLOW_RUN_BRANCH"
            source_run_id="$WORKFLOW_RUN_ID"
            # Always request organizer publish on CI success.
            skip_deploy="false"
            # Smoke uses artifact fallback by default (async VPS). Use workflow_dispatch live after rollout.
            smoke_mode="fallback"
          fi

          if [ "$branch" != "main" ]; then
            echo "Only main branch deploy requests are allowed. Got: $branch"
            exit 1
          fi

          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}/team-site:${sha}"

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "source_run_id=$source_run_id"
            echo "smoke_mode=$smoke_mode"
            echo "skip_deploy=$skip_deploy"
            echo "container_image=$image"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved deploy sha=$sha smoke_mode=$smoke_mode skip_deploy=$skip_deploy"

      - name: T28 race-safe idempotent deploy dry-run (two passes)
        id: t28
        env:
          DEPLOY_SHA: ${{ steps.request.outputs.sha }}
          LOCK_DIR: /tmp/deploy-sprint-beginners.lock
          DEPLOY_ROOT: /tmp/deploy-sprint-beginners
          LOG_FILE: ${{ github.workspace }}/t28-idempotent-deploy.log
        run: |
          set -euo pipefail
          chmod +x scripts/idempotent-deploy.sh
          : > "$LOG_FILE"

          echo "== T28 pass 1 (create/replace target) =="
          DEPLOY_PASS=1 ./scripts/idempotent-deploy.sh

          echo "== T28 pass 2 (rerun against same target — must reuse) =="
          DEPLOY_PASS=2 ./scripts/idempotent-deploy.sh

          if ! grep -q "reuse existing release directory" "$LOG_FILE"; then
            echo "Expected second pass to reuse the release directory"
            cat "$LOG_FILE"
            exit 1
          fi

          # Prove lock blocks overlapping work while held
          mkdir /tmp/deploy-sprint-beginners.lock
          if ./scripts/idempotent-deploy.sh; then
            echo "Lock should have blocked a concurrent deploy"
            exit 1
          else
            echo "T28 lock correctly blocked overlapping deploy attempt"
            echo "[T28] lock correctly blocked overlapping deploy attempt" >> "$LOG_FILE"
          fi
          rmdir /tmp/deploy-sprint-beginners.lock

          {
            echo "task=T28"
            echo "commit=${DEPLOY_SHA}"
            echo "concurrency_group=production-deploy-beginners"
            echo "cancel_in_progress=false"
            echo "lock_dir=${LOCK_DIR}"
            echo "idempotent_passes=2"
            echo "secrets_redacted=true"
          } > t28-idempotent-evidence.txt

          cat "$LOG_FILE"
          cat t28-idempotent-evidence.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload T28 idempotent deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: t28-idempotent-deploy-${{ steps.request.outputs.sha }}
          path: |
            t28-idempotent-deploy.log
            t28-idempotent-evidence.txt
          if-no-files-found: error

      - name: Authorize deploy with private token (server-side only)
        if: steps.request.outputs.skip_deploy != 'true'
        env:
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_DEPLOY_TOKEN:-}" ]; then
            echo "PRIVATE_DEPLOY_TOKEN is not configured."
            exit 1
          fi
          echo "Deploy authorized using masked PRIVATE_DEPLOY_TOKEN."

      - name: Request container deploy from organizer deployer
        if: steps.request.outputs.skip_deploy != 'true'
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          TEAM_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          CONTAINER_IMAGE: ${{ steps.request.outputs.container_image }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'deploy-sprint-team-01' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-beginners-main-merged",
              "client_payload": {
                  "team": "beginners",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "deploy_mode": "container",
                  "container_name": os.environ.get("CONTAINER_NAME", "deploy-sprint-team-01"),
                  "app_port": os.environ.get("APP_PORT", "8080"),
                  "image": os.environ["CONTAINER_IMAGE"],
                  "public_url": os.environ.get("PUBLIC_URL", ""),
                  "idempotent": True,
                  "task_markers": ["T28"],
              },
          }

          print(json.dumps(payload))
          PY

          echo "T18/T28 container deploy request: image=${CONTAINER_IMAGE} name=${CONTAINER_NAME} port=${APP_PORT} (idempotent)"

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer deployment for ${TEAM_REPO}@${TEAM_SHA}."

      - name: T28 / T21 deploy concurrency summary
        run: |
          {
            echo "## T28 race-safe idempotent deploy"
            echo ""
            echo "- concurrency group: \`production-deploy-beginners\`"
            echo "- cancel-in-progress: \`false\` (overlapping deploys queue; never cancel mid-flight)"
            echo "- lock: \`/tmp/deploy-sprint-beginners.lock\` via \`mkdir\` (starter pattern)"
            echo "- directory ops: create-or-reuse release dir + atomic \`current\` switch"
            echo "- evidence artifact: \`t28-idempotent-deploy-${{ steps.request.outputs.sha }}\`"
            echo "- two dry-run passes logged (second pass reuses same target)"
            echo ""
            echo "## T21 permissions"
            echo "- permissions: \`contents: read\`, \`actions: read\` only"
          } >> "$GITHUB_STEP_SUMMARY"
