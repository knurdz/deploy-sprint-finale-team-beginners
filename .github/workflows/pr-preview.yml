name: PR Preview

# T11: isolated preview builds for pull requests. Does not deploy to production.
# T21: no deploy secrets; pull-requests:write only for preview comments.

on:  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build PR preview artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: PR preview without deploy secrets (T21)
        id: deploy_secret_pr
        run: |
          set -euo pipefail
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "PR Preview does not read PRIVATE_DEPLOY_TOKEN or DEPLOYER_DISPATCH_TOKEN."
      - name: Install from team-site lockfile
        run: npm ci
        working-directory: team-site

      - name: Build preview (team-site)
        env:
          TEAM_NAME: ${{ vars.TEAM_NAME || 'BEGINNERS' }}
          TEAM_SLUG: ${{ vars.TEAM_SLUG || 'beginners' }}
          RELEASE_ID: ${{ github.run_id }}
          DEPLOY_TIME: ${{ github.run_started_at }}
          PUBLIC_URL_MODE: ${{ vars.PUBLIC_URL_MODE || 'domain' }}
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          IP_PUBLIC_URL: ${{ vars.IP_PUBLIC_URL }}
          DOMAIN_PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL }}
          ASSIGNED_DOMAIN: ${{ vars.ASSIGNED_DOMAIN }}
          DNS_RECORD_TYPE: ${{ vars.DNS_RECORD_TYPE }}
          DNS_RECORD_NAME: ${{ vars.DNS_RECORD_NAME }}
          DNS_RECORD_VALUE: ${{ vars.DNS_RECORD_VALUE }}
          DOMAIN_CONNECTED: "true"
          TASK_MARKER: T11-preview
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BASE_PATH: /previews/pr-${{ github.event.pull_request.number }}
          PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          PRIVATE_DEPLOY_TOKEN_CONFIGURED: ${{ steps.deploy_secret_pr.outputs.configured }}
          VITE_PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_TEAM_NAME: ${{ vars.TEAM_NAME || 'BEGINNERS' }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_RELEASE_ID: ${{ github.run_id }}
        run: npm run build
        working-directory: team-site

      - name: Write preview manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
          PREVIEW_BASE: /previews/pr-${{ github.event.pull_request.number }}
          PUBLIC_BASE: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: |
          set -euo pipefail
          node -e "
            const pr = process.env.PR_NUMBER;
            const sha = process.env.HEAD_SHA;
            const previewBase = process.env.PREVIEW_BASE;
            const publicBase = process.env.PUBLIC_BASE || '';
            const previewUrl = publicBase.replace(/\\/$/, '') + previewBase + '/';
            const manifest = {
              task: 'T11',
              pr: Number(pr),
              commit: sha,
              commit_short: sha.slice(0, 7),
              previewUrl,
              previewBasePath: previewBase,
              previewUrlField: 'previewUrl',
              productionStatusMustNotChange: true,
              artifactName: 'pr-preview-' + pr + '-' + sha,
            };
            require('node:fs').writeFileSync(
              'team-site/dist/preview-manifest.json',
              JSON.stringify(manifest, null, 2) + '\n',
            );
          "
          mkdir -p "team-site/dist/previews/pr-${PR_NUMBER}"
          cp team-site/dist/preview-manifest.json "team-site/dist/previews/pr-${PR_NUMBER}/preview-manifest.json"

      - name: Upload PR preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: team-site/dist
          if-no-files-found: error

      - name: Preview workflow summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PREVIEW_PATH="/previews/pr-${PR_NUMBER}/"
          ARTIFACT="pr-preview-${PR_NUMBER}-${HEAD_SHA}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          {
            echo "## T11 PR preview"
            echo ""
            echo "- PR: #${PR_NUMBER}"
            echo "- Commit: \`${HEAD_SHA}\`"
            echo "- Preview base path: \`${PREVIEW_PATH}\`"
            echo "- Artifact: \`${ARTIFACT}\` (download from this workflow run)"
            echo "- previewUrl (live path when VPS preview host is enabled): \`${PREVIEW_PATH}\`"
            echo "- Production deploy: **not triggered** (Request Organizer Deploy runs only after CI on \`main\`)"
            echo "- T21: no deploy secrets on PR; concurrency cancels stale preview builds for this PR"
            echo ""
            echo "[Open workflow run / download artifact](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link on PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            const runId = process.env.RUN_ID;
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${runId}`;
            const previewPath = `/previews/pr-${pr}/`;
            const artifact = `pr-preview-${pr}-${sha}`;
            const marker = `<!-- t11-pr-preview-comment -->`;
            const body = `${marker}
            ## T11 PR preview

            - **PR:** #${pr}
            - **Commit:** \`${sha}\`
            - **Artifact:** \`${artifact}\`
            - **Preview path:** \`${previewPath}\`
            - **Download:** [Actions run #${runId}](${runUrl})

            Production \`/status\` is unchanged; this workflow does not call the organizer deployer.
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body,
              });
            }
