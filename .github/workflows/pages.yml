name: Deploy dashboard

# T21: Pages deploy uses scoped permissions; separate concurrency from VPS production deploy.

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        run: npm run build
        working-directory: team-site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: team-site/dist
