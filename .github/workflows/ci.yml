name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: CI gate (install, build, upload)
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Record immutable artifact identity
        id: meta
        run: |
          set -euo pipefail
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=site-dist-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Node

        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Check private deploy token (Actions only)
        id: deploy_secret
        env:
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PRIVATE_DEPLOY_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_DEPLOY_TOKEN is configured for deploy logic (value redacted)."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_DEPLOY_TOKEN is not configured."
            exit 1
          fi

      - name: Install from team-site lockfile
        run: npm ci
        working-directory: team-site


      - name: Build once

        env:
          TEAM_NAME: ${{ vars.TEAM_NAME || 'BEGINNERS' }}
          TEAM_SLUG: ${{ vars.TEAM_SLUG || 'beginners' }}
          RELEASE_ID: ${{ github.run_id }}
          DEPLOY_TIME: ${{ github.run_started_at }}
          PUBLIC_URL_MODE: ${{ vars.PUBLIC_URL_MODE || 'domain' }}
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          IP_PUBLIC_URL: ${{ vars.IP_PUBLIC_URL }}
          DOMAIN_PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL }}
          ASSIGNED_DOMAIN: ${{ vars.ASSIGNED_DOMAIN }}
          DNS_RECORD_TYPE: ${{ vars.DNS_RECORD_TYPE }}
          DNS_RECORD_NAME: ${{ vars.DNS_RECORD_NAME }}
          DNS_RECORD_VALUE: ${{ vars.DNS_RECORD_VALUE }}
          DOMAIN_CONNECTED: "true"
          TASK_MARKER: T06
          PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          PRIVATE_DEPLOY_TOKEN_CONFIGURED: ${{ steps.deploy_secret.outputs.configured }}

          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          BUILD_ARTIFACT_NAME: site-dist-${{ github.sha }}
          TASK_MARKER: T03
        run: npm run build
        working-directory: team-site

      - name: Upload immutable dist artifact

        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist
          if-no-files-found: error

  dry-run-deploy:
    name: Dry-run deploy (consume CI artifact)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download exact CI artifact (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: deploy-dist

      - name: Verify artifact identity and write release manifest
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ ! -f deploy-dist/index.html ]; then
            echo "Downloaded artifact is missing index.html"
            exit 1
          fi
          if [ ! -f deploy-dist/status ]; then
            echo "Downloaded artifact is missing /status"
            exit 1
          fi
          if [ ! -f deploy-dist/health ]; then
            echo "Downloaded artifact is missing /health"
            exit 1
          fi

          # Guard: this job must never rebuild from source.
          if [ -f package.json ] || [ -d team-site ]; then
            echo "Unexpected source tree present in dry-run deploy job"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = os.environ["ARTIFACT_NAME"]
          commit = os.environ["COMMIT_SHA"]
          workflow_run = os.environ["WORKFLOW_RUN"]

          status = json.loads(Path("deploy-dist/status").read_text(encoding="utf-8"))
          status_artifact = status.get("artifact")
          status_run = str(status.get("workflowRun"))

          if status_artifact != artifact:
              raise SystemExit(f"status.artifact mismatch: {status_artifact!r} != {artifact!r}")
          if status.get("commit") != commit:
              raise SystemExit(f"status.commit mismatch: {status.get('commit')!r} != {commit!r}")
          if status_run != workflow_run:
              raise SystemExit(f"status.workflowRun mismatch: {status_run!r} != {workflow_run!r}")

          manifest = {
              "commit": commit,
              "artifact": artifact,
              "workflowRun": workflow_run,
              "deployMode": "dry-run-download-only",
              "rebuiltDuringDeploy": False,
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

          {
            echo "## T03 build-once deploy evidence"
            echo ""
            echo "- artifact: \`$ARTIFACT_NAME\`"
            echo "- workflowRun: \`$WORKFLOW_RUN\`"
            echo "- commit: \`$COMMIT_SHA\`"
            echo "- rebuiltDuringDeploy: false"
            echo "- deployMode: dry-run-download-only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.build.outputs.commit_sha }}
          path: release-manifest.json
          if-no-files-found: error

