name: CI

# T21: explicit least-privilege permissions; PR runs do not read deploy secrets.
# Hotfix: packages:write belongs under permissions (not concurrency); restore Resend evidence step.
# AI-REVIEW-MARKER: participant must manually remove this marker

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI gate (install, build, upload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Check private deploy token (push to main only)
        id: deploy_secret_main
        if: github.event_name == 'push'
        env:
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PRIVATE_DEPLOY_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_DEPLOY_TOKEN is configured for deploy logic (value redacted)."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_DEPLOY_TOKEN is not configured."
            exit 1
          fi

      - name: PR CI without deploy secrets (T21)
        id: deploy_secret_pr
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "Pull request CI does not read PRIVATE_DEPLOY_TOKEN or deployer secrets."

      - name: Install from team-site lockfile
        run: npm ci
        working-directory: team-site

      - name: Dependency cache and audit summary
        working-directory: team-site
        run: |
          set -euo pipefail
          {
            echo "## T12 Fast Dependency Pipeline"
            echo "- cache: npm"
            echo "- cache-dependency-path: team-site/package-lock.json"
            echo "- cache-hit: ${{ steps.setup_node.outputs.cache-hit }}"
            echo "- install command: npm ci (always runs after cache restore)"
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          npm audit --omit=dev
          audit_code=$?
          set -e
          echo "- npm audit exit code: ${audit_code} (documented only; does not fail the job)" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache hit=${{ steps.setup_node.outputs.cache-hit }}; npm ci completed; audit exit=${audit_code}"

      - name: Prepare Web3Forms contact integration
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: node scripts/prepare-web3forms.mjs
        working-directory: team-site

      - name: Verify WEB3FORMS_ACCESS_KEY secret
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WEB3FORMS_ACCESS_KEY:-}" ]; then
            echo "WEB3FORMS_ACCESS_KEY is not configured."
            exit 1
          fi
          echo "WEB3FORMS_ACCESS_KEY is configured for Web3Forms (value redacted)."

      - name: Verify RESEND_API_KEY secret
        id: resend_secret
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RESEND_API_KEY is not configured."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "RESEND_API_KEY is configured for Resend (value redacted)."

      - name: Prepare Resend email alert evidence
        id: resend_email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
          ALERT_RECIPIENT_EMAIL: ${{ vars.ALERT_RECIPIENT_EMAIL || secrets.ALERT_RECIPIENT_EMAIL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
          EMAIL_ALERT_MODE: ${{ vars.EMAIL_ALERT_MODE || 'dry-run' }}
        run: node scripts/prepare-resend-email.mjs
        working-directory: team-site

      - name: Resolve container image tags
        id: container
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}/team-site:${GITHUB_SHA}"
          local_tag="deploy-sprint/team-site:${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "local_tag=${local_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build team-site
        env:
          TEAM_NAME: ${{ vars.TEAM_NAME || 'BEGINNERS' }}
          TEAM_SLUG: ${{ vars.TEAM_SLUG || 'beginners' }}
          RELEASE_ID: ${{ github.run_id }}
          DEPLOY_TIME: ${{ github.run_started_at }}
          PUBLIC_URL_MODE: ${{ vars.PUBLIC_URL_MODE || 'domain' }}
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          IP_PUBLIC_URL: ${{ vars.IP_PUBLIC_URL }}
          DOMAIN_PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL }}
          ASSIGNED_DOMAIN: ${{ vars.ASSIGNED_DOMAIN }}
          DNS_RECORD_TYPE: ${{ vars.DNS_RECORD_TYPE }}
          DNS_RECORD_NAME: ${{ vars.DNS_RECORD_NAME }}
          DNS_RECORD_VALUE: ${{ vars.DNS_RECORD_VALUE }}
          DOMAIN_CONNECTED: "true"
          TASK_MARKER: T23
          BUILD_ARTIFACT_NAME: site-dist-${{ github.sha }}
          COMPLETED_TASK_MARKERS: T01,T02,T04,T05,T06,T07,T09,T10,T12,T15,T16,T18,T21,T23,T26
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'deploy-sprint-team-01' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          CONTAINER_IMAGE: ${{ steps.container.outputs.image }}
          PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          PRIVATE_DEPLOY_TOKEN_CONFIGURED: ${{ steps.deploy_secret_main.outputs.configured || steps.deploy_secret_pr.outputs.configured }}
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS || 'false' }}
          VITE_FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS || 'false' }}
          VITE_PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_TEAM_NAME: ${{ vars.TEAM_NAME || 'BEGINNERS' }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_RELEASE_ID: ${{ github.run_id }}
          WEB3FORMS_CONFIGURED: "true"
          WEB3FORMS_ACCESS_KEY_CONFIGURED: "true"
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
          ALERT_RECIPIENT_EMAIL: ${{ vars.ALERT_RECIPIENT_EMAIL || secrets.ALERT_RECIPIENT_EMAIL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
          EMAIL_ALERT_MODE: ${{ vars.EMAIL_ALERT_MODE || 'dry-run' }}
          RESEND_CONFIGURED: ${{ steps.resend_secret.outputs.configured }}
          RESEND_API_KEY_CONFIGURED: ${{ steps.resend_secret.outputs.configured }}
        run: npm run build
        working-directory: team-site

      - name: Generate release manifest (T23)
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOY_TIME: ${{ github.run_started_at }}
          BUILD_ARTIFACT_NAME: site-dist-${{ github.sha }}
          COMPLETED_TASK_MARKERS: T01,T02,T04,T05,T06,T07,T09,T10,T12,T15,T16,T18,T21,T23,T26
        run: node team-site/scripts/write-release-manifest.mjs

      - name: Copy release manifest into dist
        run: |
          set -euo pipefail
          cp release-manifest.json team-site/dist/release-manifest.json
          test -f team-site/dist/release-manifest.json

      - name: Upload team-site/dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist
          if-no-files-found: error

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error

      - name: Publish Resend email status evidence
        run: |
          set -euo pipefail
          {
            echo "## T16 Resend Email Alerts"
            echo ""
            echo "- Secret name: \`RESEND_API_KEY\` (value never logged)"
            echo "- Provider: resend"
            echo "- Configured: ${{ steps.resend_secret.outputs.configured }}"
            echo "- secretRedacted: true"
            echo "- Mode: \`${{ vars.EMAIL_ALERT_MODE || 'dry-run' }}\` (CI/deploy-time only; not browser)"
            echo "- Evidence: \`/status\` email block + \`/email/status.json\` in site-dist artifact"
          } >> "$GITHUB_STEP_SUMMARY"
          test -f team-site/dist/email/status.json
          test -f team-site/dist/status
          python3 - <<'PY'
          import json
          status = json.load(open("team-site/dist/status", encoding="utf-8"))
          email = status.get("email") or {}
          assert email.get("provider") == "resend", email
          assert email.get("configured") is True, email
          assert email.get("secretRedacted") is True, email
          assert "re_" not in json.dumps(status).lower()
          artifact = json.load(open("team-site/dist/email/status.json", encoding="utf-8"))
          assert artifact.get("provider") == "resend"
          assert artifact.get("configured") is True
          assert artifact.get("secretRedacted") is True
          print("T16 email status evidence OK (redacted).")
          PY

      - name: Build container image
        env:
          IMAGE: ${{ steps.container.outputs.image }}
          LOCAL_TAG: ${{ steps.container.outputs.local_tag }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'deploy-sprint-team-01' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          DOMAIN_PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL }}
          IP_PUBLIC_URL: ${{ vars.IP_PUBLIC_URL }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg TASK_MARKER=T18 \
            --build-arg CONTAINER_IMAGE="${IMAGE}" \
            --build-arg CONTAINER_NAME="${CONTAINER_NAME}" \
            --build-arg APP_PORT="${APP_PORT}" \
            --build-arg DOMAIN_PUBLIC_URL="${DOMAIN_PUBLIC_URL:-https://beginners.deploysprint-finals.knurdz.org}" \
            --build-arg IP_PUBLIC_URL="${IP_PUBLIC_URL:-http://20.114.32.177}" \
            -t "${IMAGE}" \
            -t "${LOCAL_TAG}" \
            team-site
          echo "Built container images ${IMAGE} and ${LOCAL_TAG}"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker push "${{ steps.container.outputs.image }}"

      - name: Write container deploy manifest
        env:
          IMAGE: ${{ steps.container.outputs.image }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'deploy-sprint-team-01' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          PUBLIC_URL: ${{ vars.DOMAIN_PUBLIC_URL || vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const manifest = {
              task: 'T18',
              commit: process.env.GITHUB_SHA,
              containerName: process.env.CONTAINER_NAME,
              appPort: Number(process.env.APP_PORT),
              image: process.env.IMAGE,
              publicUrl: process.env.PUBLIC_URL || '',
            };
            fs.writeFileSync('container-deploy-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Upload container deploy manifest
        uses: actions/upload-artifact@v4
        with:
          name: container-deploy-${{ github.sha }}
          path: container-deploy-manifest.json
          if-no-files-found: error

      - name: CI gate summary
        run: |
          set -euo pipefail
          {
            echo "## T06 CI gate + T18 container build"
            echo ""
            echo "- Node: 20"
            echo "- Install: \`npm ci\` (team-site lockfile)"
            echo "- Build: \`npm run build\` in \`team-site/\`"
            echo "- Artifact: \`site-dist-${GITHUB_SHA}\` from \`team-site/dist\`"
            echo "- Feature flag: FEATURE_SHOW_INSIGHTS (value redacted; boolean only in /status)"
            echo "- T21: PR runs skip deploy secrets; permissions contents:read + actions:write + packages:write"
            echo "- Container image: \`${{ steps.container.outputs.image }}\`"
            echo "- Container manifest artifact: \`container-deploy-${GITHUB_SHA}\`"
            echo "- Deploy is gated on this workflow succeeding on \`main\`"
            echo ""
            echo "## T23 release manifest"
            echo "- File: \`release-manifest.json\`"
            echo "- Artifact: \`release-manifest-${GITHUB_SHA}\`"
            echo "- Also in \`/status.releaseManifest\` and \`/release-manifest.json\`"
            echo "- Fields: commit, artifact, workflowRun, deployedAt, taskMarkers"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CI gate passed for commit ${GITHUB_SHA}."
