name: Rollback To Known-Good Release

# T21: rollback redeploys share the production concurrency group with main deploy.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Known-good tag, SHA, or artifact id to restore
        required: true
        type: string
      dry_run:
        description: When true, record rollback evidence without requesting deployer publish
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore known-good release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate release_ref
        id: target
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail

          echo "T04 rollback requested"
          echo "Raw workflow input name is release_ref (snake_case)."

          if [ -z "${RELEASE_REF}" ]; then
            echo "release_ref is empty. Provide a known-good tag, SHA, or artifact id."
            exit 1
          fi

          # Reject arbitrary shell / command injection via the input.
          if printf '%s' "${RELEASE_REF}" | grep -Eq '[^A-Za-z0-9._/-]'; then
            echo "release_ref contains unsafe characters. Use only a tag, SHA, or artifact id."
            exit 1
          fi

          echo "release_ref=${RELEASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved known-good release_ref=${RELEASE_REF}"

      - name: Write rollback manifest and summary
        env:
          RELEASE_REF: ${{ steps.target.outputs.release_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          mkdir -p rollback-evidence
          ROLLBACK_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export ROLLBACK_TIME

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release_ref = os.environ["RELEASE_REF"]
          dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
          rollback_time = os.environ["ROLLBACK_TIME"]
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          server = os.environ.get("GITHUB_SERVER_URL", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          payload = {
              "task": "T04",
              "rollback": True,
              "release_ref": release_ref,
              "known_good_release": release_ref,
              "workflow_run_id": run_id,
              "workflow_run_url": f"{server}/{repo}/actions/runs/{run_id}",
              "actor": os.environ.get("GITHUB_ACTOR", ""),
              "rollback_time": rollback_time,
              "dry_run": dry_run,
              "mode": "redeploy-selected-release-without-source-edits",
          }

          path = Path("rollback-evidence/rollback-manifest.json")
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

          {
            echo "## T04 Rollback Evidence"
            echo ""
            echo "- rollback: true"
            echo "- release_ref: \`${RELEASE_REF}\`"
            echo "- actor: \`${GITHUB_ACTOR}\`"
            echo "- rollback_time: \`${ROLLBACK_TIME}\`"
            echo "- dry_run: \`${DRY_RUN}\`"
            echo "- mode: redeploy selected known-good release (no source edits)"
            echo ""
            echo "Selected release value used by this run: \`${RELEASE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback manifest
        uses: actions/upload-artifact@v4
        with:
          name: rollback-manifest-${{ github.run_id }}
          path: rollback-evidence/rollback-manifest.json
          if-no-files-found: error

      - name: Request organizer redeploy of selected release
        if: ${{ inputs.dry_run == 'false' || inputs.dry_run == false }}
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.target.outputs.release_ref }}
          TEAM_BRANCH: main
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOYER_DISPATCH_TOKEN}" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured; cannot request live redeploy."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-beginners-main-merged",
              "client_payload": {
                  "team": "beginners",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "rollback": True,
                  "release_ref": os.environ["TEAM_SHA"],
              },
          }
          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested known-good redeploy for ${TEAM_REPO}@${TEAM_SHA}."
          echo "Requested organizer redeploy for release_ref=${TEAM_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run rollback complete
        if: ${{ inputs.dry_run == 'true' || inputs.dry_run == true }}
        env:
          RELEASE_REF: ${{ steps.target.outputs.release_ref }}
        run: |
          set -euo pipefail
          echo "Dry-run rollback recorded for known-good release_ref=${RELEASE_REF}."
          echo "No source files were edited. Selected artifact/tag/digest is preserved in the rollback manifest."
          echo "Dry-run only: deployer publish was not requested." >> "$GITHUB_STEP_SUMMARY"
