# T22: Compose-managed site runtime (env file generated on VPS at deploy time).
name: ${COMPOSE_PROJECT_NAME:-deploy-sprint-team-01}

services:
  deploy-sprint-team-01:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: ${SERVICE_NAME:-deploy-sprint-team-01}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -qx ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
